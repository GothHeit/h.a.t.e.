[package]
name = "hate"
version = "0.1.0"
description = "HATE — a pretty terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
